<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corredora de Seguros Horizonte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<header class="cabecera">
    <div class="contenido-cabecera">
        <h1>Corredora de Seguros Horizonte</h1>
        <p class="fecha-corte">Control de pólizas · Fecha de corte {{ fecha_corte.strftime('%d/%m/%Y') if fecha_corte else '--/--/----' }}</p>
    </div>
</header>

<main class="contenido">
    {% block contenido %}{% endblock %}
</main>

<footer class="pie">
    Universidad Fundepos · Técnico en IA Empresarial · Módulo 2 · Datos ficticios
</footer>

</body>
</html>
